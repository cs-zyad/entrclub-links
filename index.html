<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232055">
<title>روابط نادي ريادة الأعمال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column; the logo sits on top like the bulb, a single filament
   runs down the centre behind the links, and ends in the bulb-base dashes. */
:root {
  --navy: #232055;
  --amber: #ecb02e;
  --olive: #bac378;
  --bg: #ffffff;
  --fg: #232055;
  --muted: #6a6688;
  --card: #ffffff;
  --card-fg: #232055;
  --line: #232055;
  --disc: #ecb02e;
  --disc-fg: #232055;
  --net: rgba(186, 195, 120, .22);
  --hover: #232055;
  --hover-fg: #ffffff;
  --display: "Alexandria", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #232055; --fg: #ffffff; --muted: #b9b6d6;
    --card: #2e2a6c; --card-fg: #f8f7f0; --line: #5a52a0;
    --net: rgba(186, 195, 120, .10);
    --hover: #f2b035; --hover-fg: #232055;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #232055; --fg: #ffffff; --muted: #b9b6d6;
  --card: #2e2a6c; --card-fg: #f8f7f0; --line: #5a52a0;
  --net: rgba(186, 195, 120, .10);
  --hover: #f2b035; --hover-fg: #232055;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  padding-block: 40px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  height: auto;
  min-height: 100dvh;
}
#net { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

.page {
  position: relative; z-index: 1;
  max-width: 460px; margin-inline: auto;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
}
.head { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.logo {
  width: 112px; height: 112px; border-radius: 50%;
  border: 3px solid var(--navy);
  box-shadow: 0 0 0 6px var(--bg), 0 0 0 8px var(--amber);
  object-fit: cover; background: #fff;
}
h1 {
  font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.35;
  margin: 8px 0 0; text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); font-size: .95rem; }
.handle {
  direction: ltr; font-family: var(--display); font-weight: 500; font-size: .8rem;
  letter-spacing: .04em; color: var(--disc-fg); background: var(--amber);
  padding: 4px 12px; border-radius: 999px;
}

.links {
  position: relative; width: 100%;
  list-style: none; margin: 0; padding: 0 0 26px;
  display: flex; flex-direction: column; gap: 14px;
}
.links::before { /* the filament */
  content: ""; position: absolute; inset-block: -28px 0; left: 50%;
  width: 3px; margin-left: -1.5px; background: var(--line); border-radius: 3px;
}
.links li { position: relative; animation: rise .5s cubic-bezier(.2, .7, .2, 1) backwards; }
.links li:nth-child(2) { animation-delay: .05s } .links li:nth-child(3) { animation-delay: .1s }
.links li:nth-child(4) { animation-delay: .15s } .links li:nth-child(5) { animation-delay: .2s }
.links li:nth-child(6) { animation-delay: .25s } .links li:nth-child(7) { animation-delay: .3s }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

.links a {
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
  min-height: 60px; padding: 7px; box-sizing: border-box;
  background: var(--card); color: var(--card-fg);
  border: 2.5px solid var(--line); border-radius: 999px;
  text-decoration: none; font-family: var(--display); font-weight: 500; font-size: 1.02rem;
  transition: background .18s, color .18s, transform .18s, border-color .18s;
}
.links .name { text-align: center; min-width: 0; }
.disc {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--disc); color: var(--disc-fg);
  display: grid; place-items: center;
}
.disc svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.disc svg.fill { fill: currentColor; stroke: none; width: 19px; height: 19px; }
.go { justify-self: center; opacity: .45; transition: transform .18s, opacity .18s; }
.go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.links a, .tk { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.links a:focus-visible { background: var(--hover); color: var(--hover-fg); border-color: var(--hover);
  outline: 3px solid var(--amber); outline-offset: 3px; }
.links a:focus-visible .go { opacity: 1; }
@media (hover: hover) {
  .links a:hover { background: var(--hover); color: var(--hover-fg); border-color: var(--hover); transform: translateY(-2px); }
  .links a:hover .go { opacity: 1; transform: translateX(-4px); }
}
.links a:active { background: var(--hover); color: var(--hover-fg); border-color: var(--hover); transform: scale(.97); }
html:has(#intro:not(.open)) { overflow: hidden; }

.base { /* bulb-base dashes from the logo */
  display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: -28px;
}
.base i { display: block; height: 4px; border-radius: 4px; background: var(--line); position: relative; }
.base i:nth-child(1) { width: 46px } .base i:nth-child(2) { width: 34px } .base i:nth-child(3) { width: 22px }
.base i::after {
  content: ""; position: absolute; top: 0; left: -12px; width: 4px; height: 4px; border-radius: 50%; background: var(--amber);
}
.foot { margin: 0; color: var(--muted); font-size: .8rem; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .links li { animation: none; }
  .links a, .go { transition: none; }
}

/* ---------- boarding-pass intro ---------- */
#intro { position: fixed; inset: 0; height: 100dvh;
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 50; display: grid; place-items: center;
  background: var(--navy); padding-inline: 16px; box-sizing: border-box; overflow: hidden;
  transition: opacity .5s ease .55s, visibility 0s linear 1.05s; }
#intro.open { opacity: 0; visibility: hidden; pointer-events: none; }
#intro::before { content: ""; position: absolute; inset: 0; opacity: .5;
  background: radial-gradient(circle at 50% 38%, rgba(242,176,53,.22), transparent 55%); }
.tk { position: relative; width: min(340px, 100%); filter: drop-shadow(0 22px 30px rgba(0,0,0,.35));
  animation: tkin .9s cubic-bezier(.2,.8,.2,1) backwards; border: 0; padding: 0; background: none;
  font: inherit; color: inherit; cursor: pointer; text-align: inherit; display: block; }
@keyframes tkin { from { opacity: 0; transform: translateY(70px) rotate(-5deg) scale(.92); } }
.tk:focus-visible { outline: 3px solid var(--amber); outline-offset: 8px; border-radius: 24px; }
.tk-top, .tk-bot { position: relative; transition: transform .75s cubic-bezier(.6,0,.3,1); }
.tk-top { background: #f8f7f0; color: var(--navy); border-radius: 22px 22px 0 0; padding: 22px 22px 26px;
  display: flex; flex-direction: column; gap: 16px; }
.tk-bot { background: var(--amber); color: var(--navy); border-radius: 0 0 22px 22px; padding: 22px 22px 20px;
  display: flex; flex-direction: column; gap: 14px; align-items: center; }
.tk-top { background: radial-gradient(circle at 0 100%, var(--navy) 13px, transparent 13.5px) no-repeat,
  radial-gradient(circle at 100% 100%, var(--navy) 13px, transparent 13.5px) no-repeat, #ffffff; }
.tk-bot { background: radial-gradient(circle at 0 0, var(--navy) 13px, transparent 13.5px) no-repeat,
  radial-gradient(circle at 100% 0, var(--navy) 13px, transparent 13.5px) no-repeat, var(--amber); }
.tk-top::before { content: ""; position: absolute; left: 20px; right: 20px; bottom: 0; border-bottom: 2.5px dashed rgba(35,32,85,.35); }
.tk-eye { display: flex; justify-content: space-between; align-items: center; direction: ltr;
  font: 600 .68rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tk-eye img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--navy); background: #fff; }
.tk h2 { margin: 0; font: 700 2.1rem/1.2 var(--display); text-wrap: balance; }
.tk-route { direction: ltr; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.tk-route b { font: 700 1.5rem/1 var(--display); letter-spacing: .04em; }
.tk-route small { display: block; font: 500 .62rem/1.4 var(--body); color: var(--muted); letter-spacing: .08em; }
.tk-path { position: relative; height: 24px; border-bottom: 2.5px dotted var(--navy); margin-bottom: 4px; opacity: .8; }
.tk-path svg { position: absolute; bottom: -10px; left: 0; width: 24px; height: 24px; fill: var(--navy);
  animation: fly 2.6s cubic-bezier(.5,0,.3,1) .9s infinite; }
@keyframes fly { 0% { left: 0; opacity: 0 } 12% { opacity: 1 } 85% { opacity: 1 } 100% { left: calc(100% - 24px); opacity: 0 } }
.tk-bars { direction: ltr; display: flex; gap: 3px; height: 34px; align-items: stretch; }
.tk-bars i { display: block; background: var(--navy); width: 2px; }
.tk-bars i:nth-child(3n) { width: 4px } .tk-bars i:nth-child(5n) { width: 1px } .tk-bars i:nth-child(7n) { width: 3px }
.tk-cta { font: 700 1rem/1.3 var(--display); display: inline-flex; align-items: center; gap: 10px;
  background: var(--navy); color: #fff; border-radius: 999px; padding: 11px 22px; animation: pulse 1.8s ease-in-out infinite; }
.tk-cta svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@keyframes pulse { 50% { transform: scale(1.05); } }
#intro.open .tk-top { transform: translateY(-130%) rotate(-6deg); }
#intro.open .tk-bot { transform: translateY(130%) rotate(5deg); }
#intro.open .tk-cta { animation: none; }
@media (max-width: 360px) {
  .tk h2 { font-size: 1.75rem; } .tk-route b { font-size: 1.25rem; }
  .links a { font-size: .95rem; grid-template-columns: 40px 1fr 32px; min-height: 56px; }
  .disc { width: 40px; height: 40px; }
  h1 { font-size: 1.3rem; }
}
@media (max-height: 560px) {
  .tk-top { padding: 14px 18px 18px; gap: 10px; } .tk-bot { padding: 14px 18px 14px; gap: 10px; }
  .tk h2 { font-size: 1.6rem; } .tk-bars { height: 22px; }
  .logo { width: 84px; height: 84px; } body { padding-top: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .tk, .tk-path svg, .tk-cta { animation: none; }
  .tk-top, .tk-bot, #intro { transition-duration: .01s; transition-delay: 0s; }
}
</style>
</head>
